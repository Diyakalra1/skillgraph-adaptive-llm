[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-skillgraph_adaptive_env"
version = "0.1.0"
description = "Skillgraph Adaptive Env environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
ui = [
    "streamlit>=1.44.0",
    "matplotlib>=3.9.0",
]
training = [
    "matplotlib>=3.9.0",
    "huggingface-hub>=0.20.0",
    "openai>=1.0.0",
]
trl = [
    "torch>=2.3.1",
    "transformers>=4.46.0,<4.47.0",
    "trl>=0.11.4,<0.12.0",
    "datasets>=3.1.0",
    "accelerate>=1.0.1",
    "peft>=0.13.0",
    "bitsandbytes>=0.44.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
server = "skillgraph_adaptive_env.server.app:main"

[tool.setuptools]
include-package-data = true
# Match openenv init scaffold: root + server only (ui/training via PYTHONPATH, not installed on Space).
packages = ["skillgraph_adaptive_env", "skillgraph_adaptive_env.server"]
package-dir = { "skillgraph_adaptive_env" = ".", "skillgraph_adaptive_env.server" = "server" }